name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run default test suite
        run: pytest -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check src tests

  privacy-check:
    name: Privacy check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Reject sensitive local identifiers
        shell: bash
        run: |
          matches_file="$(mktemp)"
          status=0
          grep -rniE "stanley|yggdrasil|victus|192\.168|midgardnet|\bopi\b" \
            src/ tests/ docs/ README.md CHANGELOG.md .env.example \
            SECURITY.md CONTRIBUTING.md >"$matches_file" || status=$?
          if (( status > 1 )); then
            echo "privacy grep failed to run" >&2
            exit "$status"
          fi

          badge_url="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/ci.yml"
          allowed_badge="[![CI](${badge_url}/badge.svg)](${badge_url})"
          unexpected=0
          while IFS= read -r match; do
            content="$match"
            if [[ "$match" == README.md:* ]]; then
              content="${match#README.md:}"
              content="${content#*:}"
            fi
            if [[ "$content" == "$allowed_badge" ]]; then
              continue
            fi
            printf '%s\n' "$match"
            unexpected=1
          done <"$matches_file"
          if (( unexpected )); then
            echo "privacy check found a sensitive local identifier" >&2
            exit 1
          fi

  docker-tests:
    name: Docker integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify Docker availability
        run: docker info
      - name: Run Docker integration tests
        env:
          BROKKR_RUN_DOCKER_TESTS: "1"
        run: >-
          pytest -q
          tests/test_pdf_ocr_tooling.py
          tests/test_library_seed_integration.py
